<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,body{
            height: 100%;
        }
        body{
            text-align: center;
        }
        .biru {
            background-color: aqua;
        }

        .kotak{
            width: 50px;
            height: 50px;
            margin: 10px auto ;
        }
        .merah {
            background: red;
        }
        .biru {
            background-color:blue;
        }
        .hijau {
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>Bermain Dengan Warna </h1>
    <button type="button" id="ubahwarna">Ubah warnah</button>

    <br><br>
    <div class="kotak merah"></div>
    <input type="range" name="sMerah" min="0" max="255">
    <br><br>
    <div class="kotak hijau"></div>
    <input type="range" name="sHijau" min="0" max="255">
    <br><br>
    <div class="kotak biru"></div>
    <input type="range" name="sBiru" min="0" max="255">


    
    <script src="script.js"></script>
</body>
</html>
